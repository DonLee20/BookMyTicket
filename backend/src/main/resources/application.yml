spring:
  application:
    name: bookmyticket
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:bookmyticket}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=utf8&rewriteBatchedStatements=true
    username: ${MYSQL_USER:bookmyticket}
    password: ${MYSQL_PASSWORD:changeme_local_dev}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 10000
      pool-name: travel-pool
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
          batch_size: 50
        order_inserts: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  forward-headers-strategy: framework
  compression:
    enabled: true
  servlet:
    session:
      cookie:
        http-only: true
        same-site: lax
      timeout: 8h

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.bookmyticket: INFO
    org.hibernate.SQL: WARN

app:
  demo:
    bus-days-ahead: ${DEMO_BUS_DAYS_AHEAD:30}
    auto-seed-inventory: true
  admin:
    email: ${ADMIN_EMAIL:}
    name: ${ADMIN_NAME:Platform Administrator}
    password: ${ADMIN_PASSWORD:}
  booking:
    hold-minutes: 20
    holiday-capacity-per-departure: 24
  urls:
    irctc-official: ${IRCTC_OFFICIAL_HANDOFF_URL:https://www.irctc.co.in/nget/train-search}
    mtc-official: ${MTC_OFFICIAL_INFO_URL:https://www.mtcbus.tn.gov.in/}
  payment:
    provider: ${PAYMENT_PROVIDER:demo}
    webhook-secret: ${PAYMENT_WEBHOOK_SECRET:dev_webhook_secret_change_me}
  providers:
    bus:
      mode: ${BUS_PROVIDER_MODE:DEMO}
      # Backend-only integration placeholders. Credentials alone never enable
      # live results; a live adapter must also be installed in the backend.
      live-provider: ${BUS_LIVE_PROVIDER:}
      live-base-url: ${BUS_LIVE_BASE_URL:}
      live-api-key: ${BUS_LIVE_API_KEY:}
      live-api-secret: ${BUS_LIVE_API_SECRET:}
    railway:
      mode: ${RAILWAY_PROVIDER_MODE:DEMO}
    flight:
      mode: ${FLIGHT_PROVIDER_MODE:DEMO}
      amadeus-client-id: ${AMADEUS_CLIENT_ID:}
      amadeus-client-secret: ${AMADEUS_CLIENT_SECRET:}
    mtc:
      mode: ${MTC_PROVIDER_MODE:DEMO}
    payment:
      razorpay-key-id: ${RAZORPAY_KEY_ID:}
      razorpay-key-secret: ${RAZORPAY_KEY_SECRET:}
